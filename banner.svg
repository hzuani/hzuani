<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Team INK 곡예비행 배너">
  <style>
    .mono{font-family:SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif}
    .hud{stroke:#C9B57E;fill:none}
    .hudt{fill:#C9B57E}
  </style>
  <defs>
    <clipPath id="frame"><rect width="1000" height="260" rx="16"/></clipPath>

    <!-- 오리지널 델타익 전투기 (위에서 본 모습, 오른쪽을 향함) -->
    <g id="jet">
      <g fill="#F0B24A">
        <ellipse cx="-21" cy="-1.4" rx="5" ry="1.1"><animate attributeName="rx" values="4;6.5;4.5;6;4" dur="0.25s" repeatCount="indefinite"/></ellipse>
        <ellipse cx="-21" cy="1.4" rx="5" ry="1.1"><animate attributeName="rx" values="6;4;6.5;4.5;6" dur="0.25s" repeatCount="indefinite"/></ellipse>
      </g>
      <path fill="#2B331E" stroke="#EAF0D8" stroke-width="0.8" stroke-linejoin="round"
        d="M26 0 L15 -2.2 L9 -3 L-2 -14.5 L-8 -15 L-7 -4 L-12 -4 L-17 -10 L-20 -10 L-18 -3.2 L-18.5 -1 L-18.5 1 L-18 3.2 L-20 10 L-17 10 L-12 4 L-7 4 L-8 15 L-2 14.5 L9 3 L15 2.2 Z"/>
      <ellipse cx="12" cy="0" rx="4.2" ry="1.3" fill="#97C459"/>
    </g>

    <!-- 폭탄 분산(Bomb burst): 4기가 수직 상승 → 사방으로 갈라짐 -->
    <path id="pA" pathLength="1" d="M772 320 L772 140 C772 70 700 20 600 -60"/>
    <path id="pB" pathLength="1" d="M788 320 L788 140 C788 70 860 20 960 -60"/>
    <path id="pC" pathLength="1" d="M776 345 L776 150 C776 100 700 160 620 330"/>
    <path id="pD" pathLength="1" d="M784 345 L784 150 C784 100 860 160 940 330"/>
    <!-- 솔로기 저공 고속 통과 -->
    <path id="pS" d="M-80 214 L1100 214"/>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="260" fill="#12160D"/>
    <!-- 수평선 그리드 -->
    <g stroke="#2A3320" stroke-width="1">
      <line x1="0" y1="232" x2="1000" y2="232"/>
      <line x1="0" y1="244" x2="1000" y2="244"/>
      <line x1="0" y1="252" x2="1000" y2="252"/>
    </g>

    <!-- HUD: 모서리 브래킷 -->
    <g class="hud" stroke-width="1.5" opacity="0.7">
      <path d="M20 40 V20 H40"/><path d="M960 20 H980 V40"/>
      <path d="M20 220 V240 H40"/><path d="M960 240 H980 V220"/>
    </g>
    <!-- HUD: 고도 테이프 -->
    <g class="hud" stroke-width="1" opacity="0.55">
      <line x1="952" y1="50" x2="952" y2="210"/>
      <path d="M952 50 h-6 M952 70 h-10 M952 90 h-6 M952 110 h-10 M952 130 h-6 M952 150 h-10 M952 170 h-6 M952 190 h-10 M952 210 h-6"/>
    </g>
    <text x="958" y="46" font-size="10" class="mono hudt" opacity="0.7">ALT</text>
    <!-- HUD: 조준 레티클 -->
    <g class="hud" stroke-width="1" opacity="0.35">
      <circle cx="780" cy="130" r="38"/>
      <path d="M780 84 v14 M780 162 v14 M734 130 h14 M812 130 h14"/>
    </g>

    <!-- 타이틀 -->
    <text x="56" y="62" font-size="11" class="mono hudt" letter-spacing="2">CALLSIGN · INK-01</text>
    <text x="54" y="112" font-size="46" font-weight="800" letter-spacing="6" fill="#EAF0D8" class="sans">HZUANI</text>
    <text x="58" y="142" font-size="16" fill="#B5C28A" class="sans">학교 업무 도구를 만드는 국어 교사</text>
    <text x="58" y="172" font-size="11" class="mono hudt" letter-spacing="2" opacity="0.85">TEAM INK · AEROBATIC CODE SQUADRON</text>

    <!-- 스모크 -->
    <g fill="none" stroke-width="4" stroke-linecap="round">
      <use href="#pA" stroke="#C9B57E" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" values="1;0;0" keyTimes="0;0.6;1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.9;0" keyTimes="0;0.65;1" dur="7s" repeatCount="indefinite"/>
      </use>
      <use href="#pB" stroke="#C9B57E" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" values="1;0;0" keyTimes="0;0.6;1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.9;0" keyTimes="0;0.65;1" dur="7s" repeatCount="indefinite"/>
      </use>
      <use href="#pC" stroke="#97C459" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" values="1;0;0" keyTimes="0;0.6;1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.9;0" keyTimes="0;0.65;1" dur="7s" repeatCount="indefinite"/>
      </use>
      <use href="#pD" stroke="#97C459" stroke-dasharray="1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset" values="1;0;0" keyTimes="0;0.6;1" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.9;0" keyTimes="0;0.65;1" dur="7s" repeatCount="indefinite"/>
      </use>
    </g>

    <!-- 분산 4기 -->
    <use href="#jet" transform="scale(1.25)"><animateMotion dur="7s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1" keyTimes="0;0.6;1" calcMode="linear"><mpath href="#pA"/></animateMotion></use>
    <use href="#jet" transform="scale(1.25)"><animateMotion dur="7s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1" keyTimes="0;0.6;1" calcMode="linear"><mpath href="#pB"/></animateMotion></use>
    <use href="#jet" transform="scale(1.25)"><animateMotion dur="7s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1" keyTimes="0;0.6;1" calcMode="linear"><mpath href="#pC"/></animateMotion></use>
    <use href="#jet" transform="scale(1.25)"><animateMotion dur="7s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1" keyTimes="0;0.6;1" calcMode="linear"><mpath href="#pD"/></animateMotion></use>

    <!-- 솔로기: 분산 직후 저공 고속 통과 -->
    <g>
      <animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.62;0.8;1" calcMode="linear"><mpath href="#pS"/></animateMotion>
      <line x1="-120" y1="0" x2="-24" y2="0" stroke="#EAF0D8" stroke-width="1.2" opacity="0.4"/>
      <use href="#jet" transform="scale(1.3)"/>
    </g>
  </g>
</svg>
